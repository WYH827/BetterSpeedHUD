plugins {
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}

group='com.horizon.speedhud'
version='1.2.1'

base {
    archivesName = 'BetterSpeedHUD'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven { url='https://maven.minecraftforge.net/' }
    maven { url='https://repo.spongepowered.org/maven/' }
}

minecraft {
    mappings channel: 'official', version: '1.21.1'
    // 1.21.1 uses official mappings at runtime; no SRG reobfuscation needed.
    reobf = false
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.21.1-52.0.0'
    compileOnly 'org.spongepowered:mixin:0.8.7'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes 'MixinConfigs': 'betterspeedhud.mixins.json'
    }
}
